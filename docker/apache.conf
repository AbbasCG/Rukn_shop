<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Vite build files have a content hash in their name: cache for a year.
    <Directory /var/www/html/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    # Fonts keep their name: cache for 30 days.
    <Directory /var/www/html/public/fonts>
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    ServerSignature Off
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
