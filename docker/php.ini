; Production PHP settings for the Rukn image.
expose_php = Off
; Without this, "<?xml" in templates is read as PHP.
short_open_tag = Off
memory_limit = 256M
; Admin uploads: several product images of up to 5 MB each.
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
