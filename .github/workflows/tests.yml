# Runs on every push and pull request: the test suite on SQLite, on MariaDB
# (the database at Hostinger, where the shop runs) and on PostgreSQL, the
# front-end build and a security audit of the PHP packages.
name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb, pgsql]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rukn_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rukn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (SQLite)
        if: matrix.database == 'sqlite'
        run: php vendor/bin/phpunit

      - name: Run tests (MariaDB)
        if: matrix.database == 'mariadb'
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: rukn_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php vendor/bin/phpunit

      - name: Run tests (PostgreSQL)
        if: matrix.database == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rukn_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php vendor/bin/phpunit

  assets-and-audit:
    name: Front-end build and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check PHP packages for known vulnerabilities
        run: composer audit --locked --no-interaction

  production-branch:
    # After every push to main whose tests all pass: update the "production"
    # branch (main + compiled public/build), which Hostinger pulls from, so
    # the server never needs Node.js.
    name: Update production branch (with built assets)
    needs: [tests, assets-and-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: production-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and push the production branch
        run: bash .github/scripts/update-production-branch.sh production
